<!DOCTYPE html>
<html>
<head>
    <title>Signup</title>
</head>
<body>

<h2>Signup</h2>

{% with messages = get_flashed_messages() %}
  {% if messages %}
    {% for msg in messages %}
      <p style="color:red;">{{ msg }}</p>
    {% endfor %}
  {% endif %}
{% endwith %}

<form method="POST">
    <input type="text" name="username" placeholder="Username (5–9 chars)" required>
    <br><br>
    <input type="password" name="password" placeholder="Password" required>
    <br><br>
    <button type="submit">Signup</button>
</form>

<p>
    Already have an account?
    <a href="{{ url_for('login') }}">Login</a>
</p>

</body>
</html>
